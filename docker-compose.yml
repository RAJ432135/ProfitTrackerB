version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: vehicleprofittracker-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: vehicleprofittracker_dev
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: API/Dockerfile
    container_name: vehicleprofittracker-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=vehicleprofittracker_dev;Username=postgres;Password=postgres"
      Jwt__Secret: "CHANGE_THIS_TO_A_LONG_RANDOM_SECRET_AT_LEAST_32_CHARS"
    ports:
      - "8080:8080"

volumes:
  postgres_data:
